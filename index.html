<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Aysha's Mountain Sanctuary 🏔️</title>
  
  <meta property="og:title" content="Aysha's Mountain Sanctuary 🏔️">
  <meta property="og:description" content="A photorealistic mountain haven with real-time atmospheric sky, morning mist, and solitary cabin.">
  <meta property="og:type" content="website">
  <meta name="theme-color" content="#0a0e11">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <link rel="stylesheet" href="./src/style.css">
</head>
<body>

  <!-- Loading Screen -->
  <div id="loader">
    <div class="loader-spinner"></div>
    <div class="loader-title">The Mountain Sanctuary</div>
    <div class="loader-subtitle">Rendering atmospheric sky & mountain ridges...</div>
  </div>

  <!-- Fullscreen 3D WebGL Canvas -->
  <canvas id="webgl-canvas"></canvas>

  <!-- Minimalist Studio Watermark (Fades gently) -->
  <div class="cinematic-overlay" id="cinematicOverlay">
    <div class="cinematic-title">Aysha's Mountain Haven</div>
    <div class="cinematic-subtitle">Drag to look around • Scroll to journey</div>
  </div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
